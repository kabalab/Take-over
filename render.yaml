services:
  - type: web
    name: take-over-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DB_PATH
        value: /var/data/takeover.db
    disk:
      name: takeover-data
      mountPath: /var/data
      sizeGB: 1
