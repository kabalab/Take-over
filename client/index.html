<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take Over</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="auth-panel" class="panel hidden">
    <h1>Take Over</h1>
    <div id="auth-tabs">
      <button type="button" data-tab="signin" class="active">Sign in</button>
      <button type="button" data-tab="register">Register</button>
    </div>
    <form id="signin-form">
      <input name="username" placeholder="Username" autocomplete="username" required />
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="error" id="signin-error"></p>
    </form>
    <form id="register-form" class="hidden">
      <input name="username" placeholder="Username (3–20)" autocomplete="username" required />
      <input name="password" type="password" placeholder="Password (6+)" autocomplete="new-password" required />
      <button type="submit">Create account</button>
      <p class="error" id="register-error"></p>
    </form>
    <button type="button" id="guest-btn" class="guest-btn">Play as guest</button>
    <p class="error" id="guest-error"></p>
  </div>

  <canvas id="main"></canvas>
  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
